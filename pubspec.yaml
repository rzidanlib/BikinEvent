name: bikinevent
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  flutter_native_splash: ^2.4.3
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/splash_logo.png

flutter_native_splash:
  color: "#FBF3EE"
  image: assets/splash_logo.png
  android_12:
    color: "#FBF3EE"
    image: assets/splash_logo.png
